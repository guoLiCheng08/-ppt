ton.action{border:none;background:#2563eb;color:white;padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:700;margin:10px 5px 4px 0}.action.secondary{background:#e2efff;color:#19539a}.value{color:#0c8d76;font-weight:800}code{background:#f0f6fc;border-radius:5px;padding:2px 5px}.formula{background:#eaf5ff;border-left:4px solid #52a1ee;padding:12px 16px;border-radius:7px;margin:12px 0;line-height:1.9;font-weight:600}.note{border-left:4px solid #f0b041;background:#fff8e9;padding:12px 14px;border-radius:8px;line-height:1.75}.ok{border-left-color:#1cad91;background:#eafff8}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{background:#f5faff;padding:14px;border-radius:13px;line-height:1.6}.mini b{color:#1564b3}.quiz{background:#f7fbff;border:1px dashed #8ec8f5;padding:14px;border-radius:12px}.quiz details{margin-top:8px}.footer{font-size:13px;color:var(--muted);padding:18px 0 35px}.step{font-size:13px;color:#47738e}.svgtext{font:15px 'Microsoft YaHei',sans-serif;fill:#1c4770}.axis{stroke:#8bb0ce;stroke-width:1;stroke-dasharray:4 4}.signal{fill:none;stroke:#1881ed;stroke-width:3;stroke-linejoin:round}.mark{stroke:#f2a100;stroke-width:3;stroke-dasharray:6 5}.chip{fill:#e2f1ff;stroke:#4599df;stroke-width:2}.chip-label{fill:#135ba4;font-size:15px;font-weight:700}svg text{font-family:'Microsoft YaHei',sans-serif}@media(max-width:960px){.layout{grid-template-columns:1fr}aside{position:static;display:flex;flex-wrap:wrap;gap:4px}aside h3{width:100%}.nav{width:auto}.lab{grid-template-columns:1fr}.three{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header><span class="pill">蓝白趣味 · 可离线运行 · 工程教学</span><h1>🔬 STM32 外设原理互动实验室 · 扩展版</h1><p>操作参数 → 观察真实信号关系 → 理解内部机制 → 完成课堂提问。以 STM32F1 常见外设为主线，明确标注理想化假设。</p></header><div class="layout"><aside><h3>选择一节实验课</h3><div id="nav"></div></aside><main><section class="hero"><span class="pill" id="category">实验 01</span><h2 id="title"></h2><p class="desc" id="desc"></p></section><section class="card"><div class="lab"><div class="svgbox" id="viz"></div><div class="controls" id="controls"></div></div><p class="step" id="step"></p></section><section class="card"><h3>📚 原理与计算</h3><div id="theory"></div></section><section class="card"><h3>🧪 工程注意事项</h3><div id="caveat"></div></section><section class="card"><h3>🙋 课堂思考题</h3><div class="quiz" id="quiz"></div></section><div class="footer">本网页仅使用原生 HTML/CSS/JavaScript/SVG，无网络依赖。动态图展示协议/硬件的理想行为，不能代替具体芯片参考手册与示波器测量。</div></main></div><script>
'use strict';
const $=id=>document.getElementById(id);const S={section:'pwm',pwm:{psc:71,arr:999,ccr:250},timer:{psc:71,arr:999,mode:'up'},gpio:{mode:'input',pull:'up',button:false},adc:{vin:1.65,vref:3.3,bits:12},dma:{i:0},irq:{step:0},uart:{byte:0x55,index:0},spi:{byte:0xA5,index:0,cpol:0,cpha:0},i2c:{index:0,address:0x48}};let timer=null;
const docs={
pwm:{name:'PWM：定时器如何调节平均功率？',emoji:'🌈',desc:'改变预分频器 PSC、自动重装载 ARR、比较寄存器 CCR，观察计数器和输出波形如何对应。',theory:'<div class="formula">边沿对齐向上计数、PWM 模式 1、有效高电平：f<sub>PWM</sub> = f<sub>TIM</sub> / [(PSC+1)(ARR+1)]；当 0 ≤ CCR ≤ ARR 时，占空比 D ≈ CCR/(ARR+1)。</div><p>计数器 CNT 从 0 计至 ARR，随后更新并返回 0。在“CNT &lt; CCR 时输出有效”的理想配置下，比较值越大，高电平持续越久。</p><div class="three"><div class="mini"><b>PSC</b><br>先将计数时钟分频</div><div class="mini"><b>ARR</b><br>决定计数周期</div><div class="mini"><b>CCR</b><br>决定比较翻转位置</div></div>',caveat:'本演示默认定时器输入时钟为 72 MHz、向上计数、边沿对齐、输出极性为高有效。真实时钟取决于 RCC 与 APB 定时器时钟规则；中心对齐、反相输出、死区、预装载寄存器更新时机均需另外考虑。CCR=ARR+1 才对应常规公式下的 100% 有效占空比（具体还需考虑输出模式和寄存器边界）。',quiz:'ARR=999，PSC=71，定时器输入时钟 72 MHz。频率是多少？CCR=250 的占空比是多少？|计数频率是 1 MHz，PWM 频率为 1 kHz，占空比为 25%。'},
timer:{name:'基本定时器：计数、溢出与更新事件',emoji:'⏱️',desc:'从输入时钟到 CNT 递增，再到自动重装载更新事件，看懂定时器为什么能精准计时。',theory:'<div class="formula">向上计数、每次溢出更新：T<sub>update</sub> = (PSC+1)(ARR+1)/f<sub>TIM</sub>。</div><p>预分频值是寄存器编码值，因此要加 1；CNT 在 0~ARR 共经过 ARR+1 个计数节拍。</p>',caveat:'这里按稳态运行且忽略起停相位展示。写入 PSC、ARR 后是否立即生效还受预装载和更新事件影响；软件 UG 可以产生更新事件。不同 STM32 系列和 TIM 类型特性不同。',quiz:'PSC=71、ARR=999，f_TIM=72 MHz，更新事件间隔是多少？|1 ms，理论每秒 1000 次更新事件。'},
gpio:{name:'GPIO：输入、上拉与按键电平',emoji:'💡',desc:'点击按键，看开路与闭合时 GPIO 输入端如何由上拉或下拉电阻决定电平。',theory:'<div class="formula">输入模式下 GPIO 读取的是引脚实际逻辑电平；上拉电阻将悬空输入偏向高电平，下拉电阻将其偏向低电平。</div><p>通常将按钮一端接引脚、另一端接 GND，并使能上拉：松开读 1，按下读 0。</p>',caveat:'本图是数字逻辑示意，未模拟接触反弹、RC 时间常数、输入门限及噪声。严谨系统需要消抖和电平兼容性检查；推挽输出不可直接与外部强驱动信号对顶。STM32F1 GPIO 配置使用 CRL/CRH 等寄存器，不与新系列 MODER 写法混用。',quiz:'采用上拉输入，按键接地，按下时 IDR 读到几？|读到 0。注意按键按下可能产生机械抖动。'},
adc:{name:'ADC：模拟电压怎样变成数字量？',emoji:'📈',desc:'滑动输入电压，观察量化台阶、理想 ADC 编码和误差范围。',theory:'<div class="formula">理想 N 位单极性 ADC：量化间隔 Δ = Vref / 2<sup>N</sup>；常用简化模型 Code = min(2<sup>N</sup>−1, floor(Vin/Δ))，0 ≤ Vin ≤ Vref。</div><p>12 位 ADC 共有 4096 个编码（0~4095）。这是一个明确声明的理想均匀量化模型。</p>',caveat:'真实 STM32 ADC 的转换结果与采样时间、输入阻抗、采样保持、电压参考、INL/DNL 和校准有关。端点与量化决策阈值请以目标器件手册为准；这里演示的是教学量化模型，并非某个 STM32F103 ADC 的逐码传输特性。',quiz:'Vref=3.3 V，12 位 ADC，一个量化间隔约多少 mV？|3.3/4096 V ≈ 0.806 mV。'},
dma:{name:'DMA：不让 CPU 逐字节搬运数据',emoji:'🚚',desc:'点击搬运一步，观察外设数据寄存器如何由 DMA 写入内存数组。',theory:'<div class="formula">外设事件 → DMA 请求 → DMA 读取外设数据寄存器 → 写入目标内存 → 计数器递减。</div><p>DMA 是总线主设备/控制器执行数据搬运的机制；CPU 主要负责配置与处理完成通知，不代表搬运过程完全不占用总线带宽。</p>',caveat:'STM32F1 典型 DMA 通道映射是固定的；搬运宽度、地址递增、优先级、循环模式、传输完成和半传输中断需要明确配置。演示按外设到内存、单次线性搬运的理想顺序，不覆盖仲裁等待。',quiz:'DMA 能否让 CPU 永远不被数据采集打扰？|不能。CPU 仍需配置、处理中断/缓冲区，并可能受到总线争用影响。'},
irq:{name:'中断：CPU 如何响应紧急事件？',emoji:'🚨',desc:'逐步查看主程序、外设置位、NVIC 接收请求、ISR 执行和返回的典型链路。',theory:'<div class="formula">外设置位标志 → 中断使能/请求 → NVIC 仲裁 → CPU 异常入口与上下文保存 → ISR → 异常返回。</div><p>ISR 应尽量短；耗时工作一般通过队列、标志位或任务通知移交主循环/RTOS 任务。</p>',caveat:'NVIC 优先级的编码和分组依器件/配置而定。响应延迟受当前指令、屏蔽状态、优先级、总线访问和嵌套影响。本动画是逻辑事件步骤，并非逐时钟精确 Cortex-M 异常入口波形。',quiz:'进入 ISR 后只修改变量却不清除对应外设中断标志会怎样？|若请求条件一直成立，可能反复进入中断。'},
uart:{name:'UART：没有时钟线也能接收 0 和 1',emoji:'📨',desc:'逐比特显示 8N1 UART 发送帧；起始位、8 位数据（LSB 先发）、停止位清晰标注。',theory:'<div class="formula">8N1 帧：空闲高 → START(0) → D0…D7 → STOP(1)，共 10 位时间；t<sub>bit</sub> = 1/baud。</div><p>接收端检测到起始位下降沿后，根据约定波特率在各数据位中心附近采样。两端需要匹配波特率、数据位、校验与停止位配置。</p>',caveat:'本例默认 8N1、无校验、空闲高、LSB first，忽略线路噪声和过采样细节。逻辑高低由收发器电平标准决定；STM32 TTL/CMOS UART 引脚不是 ±12 V RS-232 电平。',quiz:'发送 0x55，8N1 的线电平位序是什么？|START=0，数据 LSB→MSB 为 1 0 1 0 1 0 1 0，STOP=1。'},
spi:{name:'SPI：跟着时钟边沿同步移位',emoji:'🤖',desc:'选择 CPOL/CPHA，观察每个时钟周期的数据与采样关系；展示 MOSI 单向示例。',theory:'<div class="formula">SPI 每个 SCK 周期可移出一位，同时可移入一位（全双工）。CPOL 定义时钟空闲极性，CPHA 定义采样位于第几个边沿。</div><p>CPHA=0 在每周期首个边沿采样、第二个边沿改变数据；CPHA=1 在首个边沿改变数据、第二个边沿采样。下方动画重点指示采样边沿。</p>',caveat:'演示默认片选在全帧保持有效、8 位、MSB first，展示 MOSI 一条数据线；真实 SPI 同时有 MISO，且首位建立时间、主从机时序、NSS 管理与实际寄存器配置必须符合手册。CPHA=1 的数据有效窗口在首个移位边沿之后形成。',quiz:'SPI Mode 0 的 CPOL/CPHA 各是多少？在哪个边沿采样？|CPOL=0，CPHA=0，在上升沿采样。'},
i2c:{name:'I²C：共享两根线如何找到设备？',emoji:'🔗',desc:'逐阶段观察 START、7 位地址、R/W、ACK、数据、ACK、STOP。',theory:'<div class="formula">空闲时 SDA/SCL 被上拉为高；SCL 为高时 SDA 从高到低为 START，从低到高为 STOP；正常数据位要求 SCL 高期间 SDA 稳定。</div><p>7 位地址先发高位，随后传输 1 位 R/W；ACK 在第 9 个时钟由接收方拉低 SDA。可利用地址连接多个不同设备。</p>',caveat:'示意为单主机向 7 位地址从机写入 0xA5 且从机应答的理想成功事务。实际需验证上拉电阻、总线电容、时钟拉伸、NACK、重复起始、仲裁以及硬件状态机。不要把 7 位设备地址与“地址左移一位并拼 R/W”的总线字节混淆。',quiz:'7 位地址 0x48，主机写操作，线上发送的地址+R/W 字节是多少？|0x90，即 (0x48 << 1) | 0。'}
};
function svg(w,h,body){return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="动态信号图">${body}</svg>`}function txt(x,y,t,size=14,color='#2b5778'){return `<text x="${x}" y="${y}" fill="${color}" font-size="${size}">${t}</text>`}function line(x1,y1,x2,y2,color='#a8c7df',width=2,dash=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:''}/>`}function rect(x,y,w,h,fill='#e9f5ff',stroke='#9bcaf3',r=9){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}"/>`}function btn(label,method,cls=''){return `<button type="button" class="action ${cls}" onclick="${method}">${label}</button>`}function ctrlRange(label,key,min,max,step,unit='',group=null){let section=group||S.section;return `<label for="${key}">${label}：<span class="value" id="v_${key}">${S[section][key]}${unit}</span></label><input id="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${S[section][key]}" oninput="change('${key}',this.value,'${unit}')">`}function change(key,val,unit=''){S[S.section][key]=+val;$('v_'+key).textContent=val+unit;draw()}
function info(title,content){return `<p><b>${title}</b><br>${content}</p>`}function bitWave(bits,x=68,y=60,width=530,low=78,high=28,selected=-1){let bw=width/bits.length;let path=`M ${x} ${bits[0]?y+high:y+low}`;bits.forEach((b,i)=>{const yp=y+(b?high:low);if(i)path+=` V ${yp}`;path+=` H ${x+(i+1)*bw}`});let shapes=`<path d="${path}" class="signal"/>`;bits.forEach((b,i)=>{if(i===selected)shapes+=rect(x+i*bw,y+8,bw,95,'#fff1d4','#f1a500',4);shapes+=txt(x+i*bw+bw*.32,y+124,String(b),14,i===selected?'#d67c00':'#3f6688')});return shapes}

function drawEncoder(){let a=S.encoder,state=`${a.a}${a.b}`,body=txt(25,34,'正交编码器 A/B 状态顺序',19);ENCS.forEach((s,i)=>{let x=28+157*i;body+=rect(x,74,124,94,s===state?'#ffebc7':'#e8f4ff',s===state?'#efad42':'#a0cdea',15)+txt(x+41,111,s,27)+txt(x+17,145,`状态 ${i+1}`,14);if(i<3)body+=txt(x+131,125,'→',19)});body+=txt(30,233,`A=${a.a}    B=${a.b}    计数值 = ${a.count}`,20,'#1780bf');return[svg(660,266,body),btn('正向 +1','encAdvance(1)')+btn('反向 -1','encAdvance(-1)')+btn('清零','S.encoder={a:0,b:0,count:0,mode:0};draw()','secondary'),`当前 AB=${state}。本演示每个有效相位跃迁计一次数。`]}

function drawCAN(){let a=S.can,bit=a.bit,bits1=a.id1.toString(2).padStart(11,'0'),bits2=a.id2.toString(2).padStart(11,'0'),div=Array.from({length:11},(_,i)=>i).find(i=>bits1[i]!==bits2[i]),winner=div===undefined?'两个 ID 相同：仍需比较后续仲裁位':bits1[div]==='0'?'节点 A 暂获胜':'节点 B 暂获胜';let body=txt(18,30,'按最高位（ID10）到最低位（ID0）逐位比较',17);for(let k=0;k<11;k++){let x=40+k*53,active=k===bit;body+=rect(x,74,46,42,active?'#ffe5ae':'#e7f3ff',active?'#eead42':'#b1d6f0',6)+txt(x+13,100,bits1[k],18);body+=rect(x,128,46,42,active?'#ffe5ae':'#e4f8ef',active?'#eead42':'#a8dbc8',6)+txt(x+13,155,bits2[k],18)}body+=txt(6,100,'A',16)+txt(6,155,'B',16)+txt(28,212,`最先不同位：${div===undefined?'无':`ID${10-div}`}  → ${winner}`,17,'#137ea1');return[svg(660,251,body),ctrlRange('节点 A 的 ID','id1',0,2047,1)+ctrlRange('节点 B 的 ID','id2',0,2047,1)+btn('下一个仲裁位','S.can.bit=(S.can.bit+1)%11;draw()'),`当前比较 ID${10-bit}：A=${bits1[bit]}，B=${bits2[bit]}；${div!==undefined&&bit>=div?winner:'尚未比较到首次分歧位'}。`]}

</style></head><body><header class="top"><h1>🔬 STM32 最小系统 · 电路互动课堂</h1><p>STM32F103C8T6 示例 ｜ 蓝白教学风 ｜ 点击模块、切换情景、观察电气关系 ｜ 离线可用</p></header><div class="wrap"><aside class="side"><button class="nav active" data-n="0"><span class="num">01</span>概览</button><button class="nav " data-n="1"><span class="num">02</span>供电</button><button class="nav " data-n="2"><span class="num">03</span>去耦</button><button class="nav " data-n="3"><span class="num">04</span>晶振</button><button class="nav " data-n="4"><span class="num">05</span>复位</button><button class="nav " data-n="5"><span class="num">06</span>启动</button><button class="nav " data-n="6"><span class="num">07</span>片内存储</button><button class="nav " data-n="7"><span class="num">08</span>调试</button><button class="nav " data-n="8"><span class="num">09</span>外围</button></aside><main class="main"><span class="pill" id="tag">STEP 01 / 09</span><h2 id="title"></h2><p id="desc"></p><div class="grid"><section class="panel"><svg id="drawing" viewBox="0 0 650 400" role="img" aria-label="电路与数据流示意图"></svg><div class="controls" id="controls"></div><div id="readout" class="value"></div></section><section class="panel"><h3>📘 原理与作用</h3><div id="lesson"></div><h3>⚠️ 工程注意</h3><div class="note" id="caution"></div><div class="quiz" id="quiz"></div></section></div></main></div><footer>教学模型不替代硬件原理图审核。依据 ST STM32F103C8 产品文档及 AN2586 设计建议；数值均注明假设。</footer><script>
const data=[["概览","最小系统","核心电路是让 MCU 可靠供电、获得时钟、按正确启动模式执行程序，并能被调试下载。","不是所有外围都强制需要外接：内部 HSI 可供时钟，外部 HSE/LSE 按应用选配。"],["供电","VDD / VSS / VDDA / VBAT","VDD/VSS 是数字电源与地；VDDA/VSSA 供模拟域；VBAT 在主电源断开时可维持 RTC/备份域。","STM32F103 的工作电压与 ADC 使用条件应按具体数据手册检查。不要把 5V 直接接 VDD。"],["去耦","0.1μF 不是装饰","数字电路开关瞬间需要电流，去耦电容就在供电脚旁边快速提供电荷，降低电源阻抗和电压扰动。","ST AN2586 建议每个 VDD 附近放 100 nF，另配约 10 µF 储能；尽量靠近引脚，减少回路面积。"],["晶振","HSI / HSE / PLL / LSE","HSI 是片内高速 RC，HSE 是外部高速时钟源；PLL 可倍频；LSE 通常为 32.768 kHz 低速晶振供 RTC。","晶振频率不等于 CPU 实际频率。系统时钟还取决于时钟选择、PLL 和总线分频。"],["复位","POR / NRST / 看门狗","复位让 CPU 与相关电路回到规定状态，并从启动流程重新执行；NRST 可外部拉低产生复位。","复位不是清除 Flash；SRAM 保持情况需要依据复位种类与供电状态判断。"],["启动","BOOT0 / BOOT1","STM32F103 启动模式由 BOOT0、BOOT1(PB2) 在复位时被采样：选择主 Flash、系统存储器或 SRAM。","BOOT0=0 通常从主 Flash 启动；BOOT0=1 时还要考虑 BOOT1。引脚不能悬空。"],["片内存储","Flash / SRAM / 备份寄存器","Flash 非易失，主要保存固件和常量；SRAM 易失，保存栈、堆、全局变量和临时缓冲。","STM32F103C8T6 标称 64KB Flash / 20KB SRAM。软件初始化时 .data 通常从 Flash 拷入 SRAM，.bss 清零。"],["调试","SWDIO / SWCLK / NRST","SWD 是下载和调试通道，通常需要 SWDIO、SWCLK、GND 与电平参考；NRST 推荐预留。","SWD 引脚与 GPIO 存在复用关系，误配置可能导致调试连接困难。"],["外围","LED / 按键 / 传感器 / 通信","LED 需要限流电阻；按键需要稳定输入电平与消抖；I²C 常需上拉；UART 注意电平和共地。","STM32 GPIO 不等于功率驱动器，电机、继电器等负载应通过合适的驱动电路。"]];let tab=0,mode=0;
const ns="http://www.w3.org/2000/svg";const sv=document.getElementById("drawing");
function node(type,a={},parent=sv,text=null){let e=document.createElementNS(ns,type);for(let k in a)e.setAttribute(k,a[k]);if(text!==null)e.textContent=text;parent.appendChild(e);return e}
function txt(x,y,t,size=17,color="#1d527d",weight="normal"){return node("text",{x,y,"font-size":size,fill:color,"font-weight":weight,"text-anchor":"middle"},sv,t)}
function rect(x,y,w,h,c="#e7f6ff",stroke="#469dd1",rad=12){return node("rect",{x,y,width:w,height:h,rx:rad,fill:c,stroke,"stroke-width":2})}
function line(x1,y1,x2,y2,c="#328fcb",width=4){return node("line",{x1,y1,x2,y2,stroke:c,"stroke-width":width,"stroke-linecap":"round"})}
function box(x,y,w,h,title,sub,c="#e7f6ff"){rect(x,y,w,h,c);txt(x+w/2,y+27,title,17,"#174e79","bold");if(sub)txt(x+w/2,y+51,sub,13)}
function arrow(x1,y1,x2,y2,c="#318bd1"){line(x1,y1,x2,y2,c,3);let a=Math.atan2(y2-y1,x2-x1);node("polygon",{points:[[x2,y2],[x2-13*Math.cos(a-.42),y2-13*Math.sin(a-.42)],[x2-13*Math.cos(a+.42),y2-13*Math.sin(a+.42)]].map(p=>p.join(",")).join(" "),fill:c})}
function button(name,fn){let b=document.createElement("button");b.className="action";b.textContent=name;b.onclick=fn;document.getElementById("controls").append(b)}
function setInfo(s){document.getElementById("readout").textContent=s}
function core(){box(239,116,171,145,"STM32F103C8T6","CPU + Flash + SRAM","#d8edff");txt(325,218,"总线 / 外设",14)}
function battery(){box(19,40,146,76,"3.3V 稳压电源","VDD / VSS","#e1faee");arrow(165,75,239,151);box(452,44,171,76,"HSE / HSI","时钟","#fff4d8");arrow(500,120,400,141);box(23,288,162,75,"BOOT + NRST","启动 / 复位","#f2eaff");arrow(185,318,239,231);box(447,288,168,75,"SWD / IO","外部连接","#e7f7fd");arrow(410,227,447,321)}
function generic(){core();battery()}
function power(){core();box(16,92,164,85,"数字 3.3V","VDD / VSS","#dff8eb");box(16,212,164,85,"模拟供电","VDDA / VSSA","#ffefda");box(454,96,176,85,"RTC 备份电源","VBAT","#f2ebff");arrow(180,134,239,150);arrow(180,257,239,224);arrow(454,140,410,150);txt(325,292,"三组电源引脚的职责不同",17)}
function cap(){box(20,80,190,96,"3.3V 电源","电流会随负载跳变","#e3faed");box(425,80,200,96,"MCU VDD / VSS","需要瞬态电流","#dbf1ff");arrow(210,132,425,132);line(325,132,325,228);line(295,228,355,228,"#ce8b37",5);line(295,243,355,243,"#ce8b37",5);line(325,243,325,285);txt(325,307,"GND",17);txt(325,215,"100 nF 就近去耦",14);let spikes=mode?["噪声增大","供电波动更明显"]:["局部储能","高频扰动更小"];txt(325,359,spikes[0]+" · "+spikes[1],19,mode?"#d97728":"#188f87","bold")}
function clock(){box(22,66,166,72,"HSI","片内 RC：8 MHz","#dcefff");box(22,185,166,72,"HSE","外部 8 MHz（示例）","#fff0cf");box(258,124,145,80,"PLL","示例 ×9","#ddf4ff");box(474,124,148,80,"SYSCLK","72 MHz","#e1f7eb");arrow(188,101,258,148);arrow(188,224,258,185);arrow(403,164,474,164);txt(329,267,mode?"选择 HSI：常见上电默认时钟":"选择 HSE→PLL：示例 8×9=72MHz",17);box(234,309,189,61,"LSE 32.768kHz","RTC 计时（可选）","#f7eaff")}
function reset(){core();box(24,132,150,75,"NRST","低电平复位","#e8f5ff");arrow(174,168,239,168);txt(326,300,mode?"NRST 被拉低 → 复位流程":"NRST 释放 → 正常运行",20,mode?"#d68524":"#138b80","bold");txt(326,336,"复位 ≠ 擦除 Flash",16)}
function boot(){core();box(16,129,161,75,"BOOT0","复位时采样","#fff0d1");arrow(177,168,239,168);let a=["BOOT0=0 → 主 Flash","BOOT0=1, BOOT1=0 → 系统存储器","BOOT0=1, BOOT1=1 → SRAM"];rect(60,288,530,63,"#e3f6ed");txt(325,324,a[mode],18,"#086f62","bold")}
function memory(){box(18,90,192,130,"Flash","64 KB（标称）","#e6f0ff");box(442,90,191,130,"SRAM","20 KB","#e4fbef");arrow(210,161,442,161);txt(325,144,".data 初始化",13);txt(325,185,"运行时读写",13);box(210,288,230,70,"CPU / 栈 / 堆",".bss 清零、局部变量","#fff3df");arrow(535,220,390,288);txt(325,51,mode?"断电：SRAM 内容通常丢失":"上电：Flash 固件仍保留",19,"#1674b4","bold")}
function swd(){box(25,136,196,100,"调试器 ST-LINK","GND / SWDIO / SWCLK","#eaf7ff");box(425,136,193,100,"STM32F103","PA13 / PA14","#e7f9ed");for(let j=0;j<3;j++){line(221,161+j*25,425,161+j*25,["#2589d4","#eca94d","#54b6a4"][j],4);txt(322,154+j*25,["SWDIO","SWCLK","GND"][j],12)}txt(326,302,mode?"断开 GND → 信号参考不可靠":"连接共同地、电平参考、时钟和数据",16)}
function io(){core();box(19,62,174,78,"LED + 电阻","限流","#fff4dc");box(458,62,173,78,"按键 + 上拉","消抖","#edfae6");box(16,294,184,74,"UART / SPI / I²C","电平、时序与布线","#f2ebff");box(452,294,183,74,"驱动器 / MOSFET","电机等大负载","#e8f6ff");arrow(193,112,239,150);arrow(458,112,410,150);arrow(239,227,200,321);arrow(410,227,452,321)}
const fun=[generic,power,cap,clock,reset,boot,memory,swd,io];
const questions=["如果只用内部 HSI，还一定要焊接 8MHz 晶振吗？","VDDA 未正确供电会影响哪些功能？","为什么电容要靠近芯片引脚，而不只是容量大？","8MHz 外部晶振为何可以得到 72MHz 主时钟？","复位后固件还在 Flash 吗？","BOOT0 悬空会导致什么不确定性？","程序变量都存储在 Flash 吗？","只接 SWDIO、SWCLK 不接 GND 可以可靠通信吗？","STM32 GPIO 能直接驱动大功率电机吗？"];
function render(i=tab){tab=i;mode=0;document.querySelectorAll(".nav").forEach((e,j)=>e.classList.toggle("active",j===i));document.getElementById("tag").textContent="STEP "+String(i+1).padStart(2,"0")+" / 09";document.getElementById("title").textContent=data[i][1];document.getElementById("desc").textContent=data[i][2];document.getElementById("lesson").textContent=data[i][2];document.getElementById("caution").textContent=data[i][3];document.getElementById("quiz").textContent="🧠 课堂思考："+questions[i];draw()}
function draw(){sv.replaceChildren();document.getElementById("controls").replaceChildren();fun[tab]();setInfo("");if([2,3,4,5,6,7].includes(tab))button(["","","切换：移远电容","切换：时钟路径","模拟 NRST","切换 BOOT 状态","模拟断电","模拟断开 GND"][tab],()=>{mode=(mode+1)%(tab===5?3:2);draw()});if(tab===0)button("查看供电",()=>render(1));if(tab===3)setInfo(mode?"HSI 8 MHz；实际 SYSCLK 取决于 RCC 设置":"示例：HSE 8 MHz × PLL 9 = SYSCLK 72 MHz");if(tab===5)setInfo(["主 Flash 正常启动","系统 Bootloader 启动","从 SRAM 启动"][mode]);if(tab===6)setInfo(mode?"SRAM 是易失存储":"Flash 是非易失存储");}
document.querySelectorAll(".nav").forEach(e=>e.onclick=()=>render(Number(e.dataset.n)));render(0);
</script></body></html>

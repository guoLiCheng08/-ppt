name: Build STM32 advanced engineering deck
on:
  push:
    branches:
      - enhance/stm32-engineering-diagrams
    paths:
      - scripts/generate_stm32_diagrams.py
      - .github/workflows/build-stm32-advanced.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install python-pptx==1.0.2
      - name: Generate editable deck
        run: python scripts/generate_stm32_diagrams.py
      - name: Commit rendered PPTX
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/STM32_Engineering_Diagram_Enhanced_v4.pptx
          if ! git diff --cached --quiet; then
            git commit -m 'Build enhanced STM32 diagram PPTX'
            git push
          fi
